services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.1
    command:
      - start-dev
      - --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_LOG_LEVEL: info,de.arbeitsagentur:debug
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../../keycloak-extension-oid4vp/core/target/keycloak-extension-oid4vp.jar:/opt/keycloak/providers/keycloak-extension-oid4vp.jar:ro
      - ./realm-wallet-demo.json:/opt/keycloak/data/import/realm-wallet-demo.json:ro
    post_start:
      # allow the admin console over plain http even when requests arrive from a non-local address
      - command:
          - /bin/sh
          - -c
          - |
            for i in $(seq 1 60); do
              /opt/keycloak/bin/kcadm.sh config credentials --server http://localhost:8080 --realm master \
                --user admin --password admin >/dev/null 2>&1 \
                && /opt/keycloak/bin/kcadm.sh update realms/master -s sslRequired=NONE && exit 0
              sleep 2
            done

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.1
    command:
      - start-dev
      - --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_LOG_LEVEL: info,de.arbeitsagentur:debug
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../../keycloak-extension-oid4vp/core/target/keycloak-extension-oid4vp.jar:/opt/keycloak/providers/keycloak-extension-oid4vp.jar:ro
      - ./realm-wallet-demo.json:/opt/keycloak/data/import/realm-wallet-demo.json:ro
    networks:
      - keycloak

# a private subnet keeps published-port source addresses private, so the admin console works
# over plain http with the default sslRequired=external of the master realm
networks:
  keycloak:
    ipam:
      config:
        - subnet: 172.28.0.0/24

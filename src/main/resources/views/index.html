    <h1>EUDI Wallet Simulator</h1>
    <p class="text-muted">
        Web-based wallet simulator for testing OID4VP verifiers. A verifier sends the browser here via its
        wallet link (<code>/authorize?client_id=&hellip;&amp;request_uri=&hellip;</code>); credentials, trust lists,
        the status list and the revocation API are managed from this page.

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head data-th-insert="~{fragments/snippets :: head}">
    <title>EUDI Wallet Simulator</title>
</head>
<body class="d-flex flex-column min-vh-100">
<nav data-th-replace="~{fragments/snippets :: navbar}"></nav>
<div class="container my-4">
    <h1>Credential data</h1>

    <form method="post" data-th-action="@{__${formAction}__}" data-th-object="${form}">
        <div id="form-error" class="alert alert-danger" data-th-if="${formError}" data-th-text="${formError}">error</div>
        <input type="hidden" data-th-if="*{flowState}" data-th-field="*{flowState}"/>

        <div class="row g-2 mb-3">
            <div class="col-4 form-floating">
                <input type="text" class="form-control" id="credential-id" data-th-field="*{id}"/>
                <label for="credential-id"><span class="text-danger">*</span> Credential id</label>
            </div>
            <div class="col-4 form-floating">
                <input type="text" class="form-control" id="credential-name" data-th-field="*{name}"/>
                <label for="credential-name"><span class="text-danger">*</span> Display name</label>
            </div>
            <div class="col-2 form-floating">
                <input type="text" class="form-control" id="credential-vct" data-th-field="*{vct}"/>
                <label for="credential-vct"><span class="text-danger">*</span> vct</label>
            </div>
            <div class="col-2 form-floating">
                <input type="number" class="form-control" id="validity-days" data-th-field="*{validityDays}"/>
                <label for="validity-days">Validity (days)</label>
            </div>
        </div>

        <h4>Claims</h4>
        <div class="row g-2 mb-2">
            <div class="col-6 form-floating" data-th-each="claim : *{claimValues}">
                <input type="text" class="form-control"
                       data-th-id="'claim-' + ${claim.key}"
                       data-th-name="'claimValues[' + ${claim.key} + ']'"
                       data-th-value="${claim.value}"/>
                <label data-th-for="'claim-' + ${claim.key}" data-th-text="${claim.key}">claim</label>
            </div>
        </div>
        <p class="text-muted">
            Nested claims use dot notation, for example address.locality. Empty a field to drop
            the claim. Plain text counts as a string, arrays as JSON, quoted text stays a string.
        </p>

        <div class="row g-2 mb-3">
            <div class="col-3 form-floating">
                <input type="text" class="form-control" id="new-claim-name" data-th-field="*{newClaimName}"/>
                <label for="new-claim-name">New claim name</label>
            </div>
            <div class="col-3 form-floating">
                <input type="text" class="form-control" id="new-claim-value" data-th-field="*{newClaimValue}"/>
                <label for="new-claim-value">New claim value</label>
            </div>
            <div class="col-2 d-flex align-items-center">
                <button type="submit" class="btn btn-outline-secondary" id="add-claim"
                        name="action" value="add-claim">Add claim</button>
            </div>
        </div>

        <button type="submit" class="btn btn-primary" id="issue-credential" style="width:15rem"
                data-th-text="*{flowState} != null ? 'Issue &amp; present' : 'Issue credential'">Issue credential</button>
        <button type="submit" class="btn btn-secondary" id="cancel-edit" style="width:15rem"
                data-th-if="*{flowState}"
                data-th-formaction="@{__${basepath}__/authorize/edit/cancel}"
                formnovalidate>Cancel</button>
        <a class="btn btn-secondary" id="cancel-edit" style="width:15rem"
           data-th-unless="*{flowState}" data-th-href="@{__${basepath}__/}">Cancel</a>
    </form>
</div>
<footer data-th-replace="~{fragments/snippets :: footer}"></footer>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head data-th-insert="~{fragments/snippets :: head}">
    <title>EUDI Wallet Simulator</title>
</head>
<body class="d-flex flex-column min-vh-100">
<nav data-th-replace="~{fragments/snippets :: navbar}"></nav>
<div class="container my-4">
    <h1>Credential data</h1>

    <form method="post" data-th-action="@{__${basepath}__/credentials/save}" data-th-object="${form}">
        <div class="alert alert-danger" data-th-if="${formError}" data-th-text="${formError}">error</div>

        <div class="row g-2 mb-3">
            <div class="col-4 form-floating">
                <input type="text" class="form-control" id="credentialId" data-th-field="*{id}"
                       data-th-classappend="${formError} ? 'is-invalid' : ''"/>
                <label for="credentialId"><span class="text-danger">*</span> Credential id</label>
            </div>
            <div class="col-4 form-floating">
                <input type="text" class="form-control" id="credentialName" data-th-field="*{name}"/>
                <label for="credentialName"><span class="text-danger">*</span> Display name</label>
            </div>
            <div class="col-2 form-floating">
                <input type="text" class="form-control" id="credentialVct" data-th-field="*{vct}"/>
                <label for="credentialVct"><span class="text-danger">*</span> vct</label>
            </div>
            <div class="col-2 form-floating">
                <input type="number" class="form-control" id="validityDays" data-th-field="*{validityDays}"/>
                <label for="validityDays">Validity (days)</label>
            </div>
        </div>

        <div class="mb-3">
            <label for="claimsJson" class="form-label"><span class="text-danger">*</span> Claims (JSON object)</label>
            <textarea class="form-control font-monospace" id="claimsJson" rows="14"
                      data-th-field="*{claimsJson}"
                      data-th-classappend="${formError} ? 'is-invalid' : ''"></textarea>
            <div class="form-text">
                Each top-level member becomes a selectively disclosable claim of the issued SD-JWT VC.
            </div>
        </div>

        <button type="submit" class="btn btn-primary" style="width:15rem">Issue credential</button>
        <a class="btn btn-secondary" style="width:15rem" data-th-href="@{__${basepath}__/}">Cancel</a>
    </form>
</div>
<footer data-th-replace="~{fragments/snippets :: footer}"></footer>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head data-th-replace="~{fragments/snippets :: head}"></head>
<body>
<nav data-th-replace="~{fragments/snippets :: navbar}"></nav>
<div class="container">
    <h1>Present credentials</h1>
    <p class="text-muted">
        Verifier <code data-th-text="${verifierClientId}">client id</code> requests a credential presentation.
        Select a credential for every requested query.
    </p>

    <div id="conformance-warnings" class="alert alert-warning" data-th-if="${findings != null and not #lists.isEmpty(findings)}">
        <strong>Verifier conformance warnings</strong>
        <ul class="mb-0">
            <li data-th-each="finding : ${findings}" data-th-text="${finding.message}">finding</li>
        </ul>
    </div>

    <form method="post" data-th-action="@{__${basepath}__/authorize/submit}">
        <input type="hidden" name="flowState" data-th-value="${flowState}"/>
        <input type="hidden" data-th-if="${singlePresentationCredential}" name="singlePresentationCredential" data-th-value="${singlePresentationCredential}"/>

        <div class="alert alert-warning" data-th-unless="${satisfiable}">
            No credential in this wallet matches the verifier's query.
        </div>

        <div class="row g-2 mb-3" data-th-each="choice : ${setChoices}"
             data-th-if="${choice.options.size() > 1 or !choice.required}">
            <div class="col-8 form-floating">
                <select class="form-select" data-alternatives-select
                        data-th-id="'set-option-' + ${choice.index}"
                        data-th-name="'setOption[' + ${choice.index} + ']'">
                    <option data-th-each="option : ${choice.options}"
                            data-th-value="${option.index}"
                            data-th-attr="data-query-ids=${#strings.listJoin(option.queryIds, ',')}"
                            data-th-text="'Present ' + ${option.label}">option</option>
                    <option data-th-unless="${choice.required}" value="skip" data-query-ids="">
                        Do not present
                    </option>
                </select>
                <label data-th-for="'set-option-' + ${choice.index}">The verifier accepts alternatives</label>
            </div>
        </div>

        <div data-th-each="slot : ${slots}" data-th-if="${not #lists.isEmpty(slot.matches)}"
             data-th-attr="data-query-slot=${slot.queryId}">
            <h4 data-th-text="'Credentials for query ' + ${slot.queryId}">Credentials</h4>
            <div class="row g-2 mb-3" data-th-if="${slot.claimSetOptions.size() > 1}">
                <div class="col-8 form-floating">
                    <select class="form-select" data-claim-set-select
                            data-th-attr="data-query-id=${slot.queryId}"
                            data-th-id="'claim-set-' + ${slot.queryId}"
                            data-th-name="'claimSet[' + ${slot.queryId} + ']'">
                        <option data-th-each="option : ${slot.claimSetOptions}"
                                data-th-value="${option.index}"
                                data-th-text="${option.label}">claims</option>
                    </select>
                    <label data-th-for="'claim-set-' + ${slot.queryId}">Claim set to answer with</label>
                </div>
            </div>
            <div class="row row-cols-3 g-2 mb-3">
                <div class="col" data-th-each="match, iterStat : ${slot.matches}">
                    <div class="card p-2 h-100" data-th-attr="data-credential-id=${match.credential.id}">
                        <div class="form-check">
                            <input class="form-check-input" type="radio"
                                   data-th-name="'selection[' + ${slot.queryId} + ']'"
                                   data-th-id="'select-' + ${slot.queryId} + '-' + ${match.credential.id}"
                                   data-th-value="${match.credential.id}"
                                   data-th-checked="${preselectedCredentialId != null}
                                       ? ${match.credential.id == preselectedCredentialId}
                                       : ${iterStat.first}"/>
                            <label class="form-check-label w-100"
                                   data-th-for="'select-' + ${slot.queryId} + '-' + ${match.credential.id}">
                                <strong data-th-text="${match.credential.name}">Credential</strong>
                                <span class="badge text-bg-warning"
                                      data-th-if="${match.credential.source.name() == 'SINGLE_PRESENTATION'}">modified for this presentation</span><br/>
                                <span class="text-muted" data-th-text="${match.credential.vct}">vct</span><br/>
                                <small data-th-each="option : ${match.claimSetOptions}"
                                       data-th-attr="data-claim-set-query=${slot.queryId},data-claim-set-option=${option.index}">Disclosed claims:
                                    <span data-th-text="${option.label}">claims</span>
                                </small><br/>
                                <small class="text-muted">ID:</small> <code data-th-text="${match.credential.id}">id</code>
                            </label>
                        </div>
                    </div>
                </div>
            </div>
            <button type="submit" class="btn btn-outline-primary btn-sm mb-3"
                    name="editQueryId" data-th-value="${slot.queryId}"
                    data-th-id="'new-from-template-' + ${slot.queryId}"
                    data-th-formaction="@{__${basepath}__/authorize/edit}"
                    formnovalidate>New from template</button>
        </div>

        <button type="submit" class="btn btn-primary" id="present-credential" style="width:15rem"
                data-th-disabled="${!satisfiable}"
                data-th-text="${slots.size() > 1} ? 'Present credentials' : 'Present credential'">Present credential</button>
        <button type="submit" class="btn btn-secondary" id="cancel-presentation" style="width:15rem"
                data-th-formaction="@{__${basepath}__/authorize/cancel}">Cancel</button>
    </form>
</div>
<script src="" data-th-src="@{__${basepath}__/js/alternatives.js}"></script>
<footer data-th-replace="~{fragments/snippets :: footer}"></footer>
</body>
</html>

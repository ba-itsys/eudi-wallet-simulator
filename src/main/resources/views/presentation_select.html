<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head data-th-insert="~{fragments/snippets :: head}">
    <title>EUDI Wallet Simulator</title>
</head>
<body>
<nav data-th-replace="~{fragments/snippets :: navbar}"></nav>
<div class="container">
    <h1>Present credentials</h1>
    <p class="text-muted">
        Verifier <code data-th-text="${verifierClientId}">client id</code> requests a credential presentation.
        Select a credential for every requested query.
    </p>

    <div id="conformance-warnings" class="alert alert-warning" data-th-if="${findings != null and not #lists.isEmpty(findings)}">
        <strong>Verifier conformance warnings</strong>
        <ul class="mb-0">
            <li data-th-each="finding : ${findings}" data-th-text="${finding.message}">finding</li>
        </ul>
    </div>

    <form method="post" data-th-action="@{__${basepath}__/authorize/submit}">
        <input type="hidden" name="flowState" data-th-value="${flowState}"/>

        <div class="alert alert-warning" data-th-unless="${satisfiable}">
            No credential in this wallet matches the verifier's query.
        </div>

        <div data-th-each="choice : ${setChoices}" data-th-if="${choice.options.size() > 1 or !choice.required}">
            <h4>The verifier accepts alternatives</h4>
            <div class="form-check" data-th-each="label, optStat : ${choice.optionLabels}">
                <input class="form-check-input" type="radio"
                       data-th-name="'setOption[' + ${choice.index} + ']'"
                       data-th-id="'set-option-' + ${choice.index} + '-' + ${optStat.index}"
                       data-th-value="${optStat.index}"
                       data-th-checked="${optStat.first}"/>
                <label class="form-check-label"
                       data-th-for="'set-option-' + ${choice.index} + '-' + ${optStat.index}"
                       data-th-text="'Present ' + ${label}">option</label>
            </div>
            <div class="form-check mb-3" data-th-unless="${choice.required}">
                <input class="form-check-input" type="radio"
                       data-th-name="'setOption[' + ${choice.index} + ']'"
                       data-th-id="'set-option-' + ${choice.index} + '-skip'"
                       value="skip"/>
                <label class="form-check-label"
                       data-th-for="'set-option-' + ${choice.index} + '-skip'">Do not present</label>
            </div>
        </div>

        <div data-th-each="slot : ${slots}" data-th-if="${not #lists.isEmpty(slot.matches)}">
            <h4 data-th-text="'Credentials for query ' + ${slot.queryId}">Credentials</h4>
            <div class="row row-cols-3 g-2 mb-3">
                <div class="col" data-th-each="match, iterStat : ${slot.matches}">
                    <div class="card p-2 h-100" data-th-attr="data-credential-id=${match.credential.id}">
                        <div class="form-check">
                            <input class="form-check-input" type="radio"
                                   data-th-name="'selection[' + ${slot.queryId} + ']'"
                                   data-th-id="'select-' + ${slot.queryId} + '-' + ${match.credential.id}"
                                   data-th-value="${match.credential.id}"
                                   data-th-checked="${iterStat.first}"/>
                            <label class="form-check-label w-100"
                                   data-th-for="'select-' + ${slot.queryId} + '-' + ${match.credential.id}">
                                <strong data-th-text="${match.credential.name}">Credential</strong><br/>
                                <span class="text-muted" data-th-text="${match.credential.vct}">vct</span><br/>
                                <small>Disclosed claims:
                                    <span data-th-text="${#strings.listJoin(match.claimsToDiscloseDisplay, ', ')}">claims</span>
                                </small><br/>
                                <small class="text-muted">ID:</small> <code data-th-text="${match.credential.id}">id</code>
                            </label>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <button type="submit" class="btn btn-primary" id="present-credential" style="width:15rem"
                data-th-disabled="${!satisfiable}">Present credential</button>
        <button type="submit" class="btn btn-outline-primary" id="edit-and-present" style="width:15rem"
                data-th-formaction="@{__${basepath}__/authorize/edit}"
                data-th-disabled="${!satisfiable}">Edit &amp; present (optional)</button>
        <button type="submit" class="btn btn-secondary" id="cancel-presentation" style="width:15rem"
                data-th-formaction="@{__${basepath}__/authorize/cancel}">Cancel</button>
    </form>
</div>
<footer data-th-replace="~{fragments/snippets :: footer}"></footer>
</body>
</html>

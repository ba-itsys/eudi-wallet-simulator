<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head data-th-fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-th-text="${@environment.getProperty('app.web.title')}">EUDI Wallet Simulator</title>
    <link rel="stylesheet" data-th-href="@{__${basepath}__/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" data-th-href="@{__${basepath}__/css/layout.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg" data-th-fragment="navbar">
    <div class="container-fluid">
        <span class="navbar-brand text-white" data-th-text="${@environment.getProperty('app.web.title')}">EUDI Wallet Simulator</span>
        <span class="navbar-text text-white"
              data-th-text="'Environment: ' + ${@environment.getProperty('app.env')}">Environment: localDEV</span>
    </div>
</nav>
<footer class="py-2 px-3 mt-auto" data-th-fragment="footer">
    <span data-th-text="${@environment.getProperty('app.web.title')} + ' ' + ${@environment.getProperty('spring.application.version')}">EUDI Wallet Simulator</span>
</footer>
</body>
</html>

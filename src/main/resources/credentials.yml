# Claim names follow the EUDI PID rulebook for the SD-JWT VC encoding. Every claim is selectively
# disclosable unless the credential lists it in alwaysDisclosedClaims.
credentials:
  # The common EU PID, with the optional EU attributes that a German PID never carries.
  - id: pid-jan-hart
    name: "PID Jan Wijnand 't Hart (NL)"
    vct: "urn:eudi:pid:1"
    validityDays: 365
    claims:
      family_name: "'t Hart"
      given_name: "Jan Wijnand"
      birth_family_name: "Poepjes"
      birth_given_name: "Björn"
      birthdate: "1978-02-12"
      place_of_birth:
        locality: "Amsterdam"
        region: "Noord-Holland"
        country: "NL"
      nationalities:
        - "NL"
      address:
        formatted: "Rietveld 1, 2312 JD Leiden"
        street_address: "Rietveld 1"
        house_number: "1"
        postal_code: "2312 JD"
        locality: "Leiden"
        region: "Zuid-Holland"
        country: "NL"
      sex: 1
      # The portrait is mandatory under CIR 2024/2977 unless the holder opts out. SD-JWT VC carries
      # it as the OIDC picture claim, a data URL with a JPEG. This one is a neutral placeholder
      # silhouette, 120x150 pixels.
      picture: "data:image/jpeg;base64,"
      email: "wijnandthart@example.com"
      phone_number: "+31123456789"
      personal_administrative_number: "123456782"
      document_number: "A01234567"
      date_of_issuance: "2026-01-15"
      date_of_expiry: "2036-01-14"
      issuing_authority: "Rijksdienst voor Identiteitsgegevens"
      issuing_country: "NL"

  # The German PID Rulebook 1.0.0 of the BMI blueprint, see
  # https://bmi.usercontent.opencode.de/eudi-wallet/eidas-2.0-architekturkonzept/content/features/PID/german-pid-rulebook/.
  # A string value the eID does not carry is an empty string, and string values come from the eID
  # in upper case. birth_name may hold both given and family name at birth, so it is not the EU
  # birth_family_name. raw_eid_birth_date is the birth date as the eID stores it, which may carry
  # 00 for an unknown day or month. There is no date_of_expiry, validityDays is the technical
  # validity of 14 days.
  - id: pid-thomas-bauer
    name: "PID Thomas Bauer (DE)"
    vct: "urn:eudi:pid:de:1"
    validityDays: 14
    claims:
      family_name: "BAUER"
      birth_name: ""
      given_name: "THOMAS"
      academic_title: "DR."
      address:
        street_address: "LEOPOLDSTRAẞE 12"
        postal_code: "80802"
        locality: "MÜNCHEN"
        region: "BAYERN"
        country: "DE"
      nationalities:
        - "DE"
      birthdate: "1988-03-27"
      raw_eid_birth_date: "1988-03-27"
      place_of_birth:
        locality: "MÜNCHEN"
      age_equal_or_over:
        "12": true
        "14": true
        "16": true
        "18": true
        "21": true
        "65": false
      issuing_authority: "DE"
      issuing_country: "DE"
      source_document_type: "ID"

  # The specimen person of the German ID card, with the values from the rulebook's example PID.
  - id: pid-erika-mustermann
    name: "PID Erika Mustermann (DE)"
    vct: "urn:eudi:pid:de:1"
    validityDays: 14
    claims:
      family_name: "MUSTERMANN"
      birth_name: "GABLER"
      given_name: "ERIKA"
      academic_title: ""
      address:
        street_address: "HEIDESTRAẞE 17"
        postal_code: "51147"
        locality: "KÖLN"
        region: "NORDRHEIN-WESTFALEN"
        country: "DE"
      nationalities:
        - "DE"
      birthdate: "1964-08-12"
      raw_eid_birth_date: "1964-08-12"
      place_of_birth:
        locality: "BERLIN"
      age_equal_or_over:
        "12": true
        "14": true
        "16": true
        "18": true
        "21": true
        "65": false
      issuing_authority: "DE"
      issuing_country: "DE"
      source_document_type: "ID"

  # The Italian profile carries the codice fiscale as tax_id_code, has no address and no
  # administrative validity, and keeps the issuer claims outside the selective disclosures.
  - id: pid-sofia-rossi
    name: "PID Sofia Rossi (IT, no address)"
    vct: "urn:eudi:pid:it:1"
    validityDays: 365
    claims:
      family_name: "Rossi"
      given_name: "Sofia"
      birthdate: "1995-06-14"
      place_of_birth:
        locality: "Roma"
        country: "IT"
      nationalities:
        - "IT"
      sex: 2
      tax_id_code: "TINIT-RSSSFO95H54H501E"
      personal_administrative_number: "AB12345CD"
      document_number: "CA00000AA"
      issuing_authority: "Istituto Poligrafico e Zecca dello Stato"
      issuing_country: "IT"
    alwaysDisclosedClaims:
      - "issuing_authority"
      - "issuing_country"

  # The European Health Insurance Card has no rulebook in the EUDI catalog yet, so this credential
  # models the data set printed on the physical card.
  - id: ehic-erika-mustermann
    name: "EHIC Erika Mustermann"
    vct: "urn:eudi:ehic:1"
    validityDays: 365
    claims:
      family_name: "Mustermann"
      given_name: "Erika"
      birthdate: "1964-08-12"
      personal_administrative_number: "A123456789"
      document_number: "80276001293672514"
      issuing_authority: "AOK Rheinland/Hamburg"
      issuing_country: "DE"
      date_of_expiry: "2030-06-30"

# PID credentials use the claim names that the EUDI PID rulebook defines for the SD-JWT VC
# encoding. No attribute has to be a plain member of the credential body, so every claim here is
# selectively disclosable. Add alwaysDisclosedClaims to a credential to turn single claims into
# plain body members.
#
# The urn:eudi:pid:de:1 credentials follow the German PID rulebook, which is narrower than the EU
# one. A German PID has no document number, no personal administrative number, no issuing
# jurisdiction and no sex, because the eID card these attributes would come from does not carry
# them. It adds source_document_type, birth_name and age_equal_or_over, and stores string values
# in upper case following ICAO Doc 9303.
credentials:
  - id: pid-maria-neumann
    name: "PID Maria Neumann"
    vct: "urn:eudi:pid:1"
    validityDays: 365
    claims:
      family_name: "Neumann"
      given_name: "Maria"
      birthdate: "1964-08-12"
      place_of_birth:
        locality: "Berlin"
        country: "DE"
      nationalities:
        - "DE"
      address:
        street_address: "Thomas-Mann-Straße 3"
        postal_code: "10409"
        locality: "Berlin"
        region: "Berlin"
        country: "DE"
      date_of_issuance: "2026-01-15"
      date_of_expiry: "2036-01-14"
      issuing_authority: "EUDI Wallet Simulator"
      issuing_country: "DE"

  - id: pid-thomas-bauer
    name: "PID Thomas Bauer (DE)"
    vct: "urn:eudi:pid:de:1"
    validityDays: 365
    claims:
      family_name: "BAUER"
      given_name: "THOMAS"
      birthdate: "1988-03-27"
      place_of_birth:
        locality: "MÜNCHEN"
      nationalities:
        - "DE"
      address:
        street_address: "LEOPOLDSTRASSE 12"
        postal_code: "80802"
        locality: "MÜNCHEN"
        region: "BAYERN"
        country: "DE"
      source_document_type: "ID"
      age_equal_or_over:
        "12": true
        "14": true
        "16": true
        "18": true
        "21": true
        "65": false
      date_of_expiry: "2033-05-30"
      issuing_authority: "DE"
      issuing_country: "DE"

  - id: pid-erika-mustermann
    name: "PID Erika Mustermann (DE)"
    vct: "urn:eudi:pid:de:1"
    validityDays: 365
    claims:
      family_name: "MUSTERMANN"
      given_name: "ERIKA"
      birthdate: "1983-08-12"
      place_of_birth:
        locality: "BERLIN"
      nationalities:
        - "DE"
      address:
        street_address: "HEIDESTRASSE 17"
        postal_code: "51147"
        locality: "KÖLN"
        region: "NORDRHEIN-WESTFALEN"
        country: "DE"
      birth_name: "GABLER"
      source_document_type: "ID"
      age_equal_or_over:
        "12": true
        "14": true
        "16": true
        "18": true
        "21": true
        "65": false
      date_of_expiry: "2031-08-01"
      issuing_authority: "DE"
      issuing_country: "DE"

  # A foreign PID. Italy issues the codice fiscale as personal_administrative_number, so this
  # credential also covers the EU optional attributes that a German PID never carries.
  - id: pid-sofia-rossi
    name: "PID Sofia Rossi (IT, no address)"
    vct: "urn:eudi:pid:it:1"
    validityDays: 365
    claims:
      family_name: "Rossi"
      given_name: "Sofia"
      birthdate: "1995-06-14"
      place_of_birth:
        locality: "Roma"
        country: "IT"
      nationalities:
        - "IT"
      sex: 2
      personal_administrative_number: "RSSSFO95H54H501K"
      document_number: "CA00000AA"
      date_of_issuance: "2026-01-15"
      date_of_expiry: "2036-01-14"
      issuing_authority: "Ministero dell'Interno"
      issuing_country: "IT"

  # The European Health Insurance Card has no rulebook in the EUDI catalog yet, so this credential
  # models the data set printed on the physical card.
  - id: ehic-maria-neumann
    name: "EHIC Maria Neumann"
    vct: "urn:eudi:ehic:1"
    validityDays: 365
    claims:
      family_name: "Neumann"
      given_name: "Maria"
      birthdate: "1964-08-12"
      personal_administrative_number: "A123456789"
      document_number: "80276001293672514"
      issuing_authority: "AOK Nordost"
      issuing_country: "DE"
      date_of_expiry: "2030-06-30"

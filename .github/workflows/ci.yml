name: CI

on:
  pull_request:
    branches:
      - 'main'
  workflow_dispatch: { }

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Maven verify (tests + spotless)
        run: mvn -B verify

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        name: Docker Build only
        with:
          push: false
          tags: ghcr.io/${{ github.repository }}:${{ github.run_number }}

  # Note: The name `automerge-check` is configured in the ruleset (repo settings) as a required merge check
  automerge-check:
    runs-on: ubuntu-latest
    needs: [ verify, build ]
    if: always()
    steps:
      - name: Verify all jobs succeeded
        run: |
          results="${{ needs.verify.result }} ${{ needs.build.result }}"
          echo "Job results: $results"
          for result in $results; do
            if [ "$result" != "success" ]; then
              echo "At least one job did not succeed"
              exit 1
            fi
          done
          echo "All jobs succeeded"
